name: Event Lakehouse CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb dbt-duckdb

      - name: Run Event Producer (Seed Data)
        run: |
          python producer.py

      - name: Set CI Schema Name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "DBT_TARGET_SCHEMA=ci_pr_${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "DBT_TARGET_SCHEMA=ci_commit_${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Run dbt Debug & Build in CI Schema
        run: |
          cd transform_github_events
          dbt debug
          dbt build