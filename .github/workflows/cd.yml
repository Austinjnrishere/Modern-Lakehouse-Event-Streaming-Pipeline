name: Event Lakehouse CD Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out production code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Optional: speeds up workflow by caching pip downloads

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb dbt-duckdb

      - name: Fetch Latest Event Stream (Ingestion)
        run: |
          python producer.py

      # NEW STEP: Create the profiles.yml dynamically for Linux runner
      - name: Create profiles.yml for Production
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          transform_github_events:
            target: prod
            outputs:
              dev:
                type: duckdb
                path: events_lakehouse.duckdb
                schema: main
              prod:
                type: duckdb
                path: events_lakehouse.duckdb
                schema: prod
          EOF

      - name: Execute dbt Build in Production Schema
        run: |
          dbt build --target prod

      - name: Store Production DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-duckdb-db
          path: events_lakehouse.duckdb