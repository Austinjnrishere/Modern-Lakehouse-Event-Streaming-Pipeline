name: Event Lakehouse CD Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple simultaneous deployments to Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out production code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb dbt-duckdb

      - name: Fetch Latest Event Stream (Ingestion)
        run: |
          python producer.py

      - name: Create profiles.yml for Production
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          transform_github_events:
            target: prod
            outputs:
              dev:
                type: duckdb
                path: events_lakehouse.duckdb
                schema: main
              prod:
                type: duckdb
                path: events_lakehouse.duckdb
                schema: prod
          EOF

      - name: Execute dbt Build in Production Schema
        run: |
          dbt build --target prod

      # NEW STEP: Generate the dbt documentation
      - name: Generate dbt Documentation
        run: |
          dbt docs generate --target prod

      - name: Store Production DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-duckdb-db
          path: events_lakehouse.duckdb

      # --- GitHub Pages Deployment Steps ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # dbt puts its generated docs in the 'target' folder
      - name: Upload dbt Docs as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './target' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4